<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLC P2P Sync Hub</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; width: 100%; max-width: 440px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { margin: 0 0 16px 0; text-align: center; }
        .box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
        input { width: 100%; box-sizing: border-box; background: #1e293b; border: 1px solid #475569; color: white; padding: 8px; border-radius: 6px; margin-bottom: 8px; }
        .btn-row { display: flex; gap: 8px; }
        button { flex: 1; background: #3b82f6; border: none; color: white; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        button:hover { opacity: 0.9; }
        button.secondary { background: #6366f1; }
        .status { display: flex; justify-content: space-between; font-size: 13px; margin-top: 6px; }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; background: #ef4444; margin-right: 4px; }
        .dot.online { background: #22c55e; }
        .display { text-align: center; font-weight: bold; background: #334155; padding: 10px; border-radius: 6px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🍿 VLC P2P Sync</h2>

    <!-- Local Desktop Bridge -->
    <div class="box">
        <label>Local Desktop Bridge</label>
        <div class="status">
            <span>Desktop Bridge Status:</span>
            <span><span id="bridgeDot" class="dot"></span> <span id="bridgeStatus">Connecting to Python...</span></span>
        </div>
    </div>

    <!-- P2P Room Connection -->
    <div class="box">
        <label>Room ID</label>
        <input type="text" id="roomId" placeholder="Enter room ID (e.g. movie123)">
        <div class="btn-row">
            <button onclick="createRoom()">Host Room</button>
            <button class="secondary" onclick="joinRoom()">Join Room</button>
        </div>
        <div class="status" style="margin-top: 10px;">
            <span>Peer Connection:</span>
            <span><span id="peerDot" class="dot"></span> <span id="peerStatus">Not Connected</span></span>
        </div>
    </div>

    <!-- Playback Status & Controls -->
    <div class="box">
        <div class="display" id="playerDisplay">VLC: --:-- (Paused)</div>
        <div class="status" style="margin-top: 8px;">
            <span>Sync Offset:</span>
            <span id="driftDisplay">0.00s</span>
        </div>
        <div class="btn-row" style="margin-top: 10px;">
            <button onclick="sendControl('play')">▶ Play</button>
            <button onclick="sendControl('pause')" style="background: #475569;">⏸ Pause</button>
        </div>
    </div>
</div>

<script>
    let peer = null;
    let peerConn = null;
    let wsBridge = null;

    // 1. WebSocket Bridge Connection
    function initBridge() {
        wsBridge = new WebSocket('ws://localhost:9999');

        wsBridge.onopen = () => {
            document.getElementById('bridgeDot').className = 'dot online';
            document.getElementById('bridgeStatus').innerText = 'Connected';
        };

        wsBridge.onclose = () => {
            document.getElementById('bridgeDot').className = 'dot';
            document.getElementById('bridgeStatus').innerText = 'Offline (Run vlc_bridge.py)';
            setTimeout(initBridge, 2000);
        };

        wsBridge.onerror = () => {
            wsBridge.close();
        };

        wsBridge.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                // Update UI
                const mins = Math.floor(data.time / 60);
                const secs = (data.time % 60).toString().padStart(2, '0');
                document.getElementById('playerDisplay').innerText = `VLC: ${mins}:${secs} (${data.state.toUpperCase()})`;

                // Send to friend if connected
                if (peerConn && peerConn.open && data.origin === "local") {
                    peerConn.send(data);
                }
            } catch(e) {}
        };
    }
    initBridge();

    // 2. PeerJS Setup
    function createRoom() {
        const id = document.getElementById('roomId').value.trim();
        if (peer) peer.destroy();
        peer = id ? new Peer(id) : new Peer();

        peer.on('open', (assignedId) => {
            document.getElementById('roomId').value = assignedId;
            document.getElementById('peerStatus').innerText = 'Room Open (Share ID)';
        });

        peer.on('connection', (conn) => {
            peerConn = conn;
            setupPeerEvents();
        });

        peer.on('error', (err) => {
            alert('Peer error: ' + err.type);
        });
    }

    function joinRoom() {
        const id = document.getElementById('roomId').value.trim();
        if (!id) return alert('Enter Room ID to join');

        if (peer) peer.destroy();
        peer = new Peer();

        peer.on('open', () => {
            peerConn = peer.connect(id);
            setupPeerEvents();
        });

        peer.on('error', (err) => {
            alert('Peer error: ' + err.type);
        });
    }

    function setupPeerEvents() {
        peerConn.on('open', () => {
            document.getElementById('peerDot').className = 'dot online';
            document.getElementById('peerStatus').innerText = 'Connected to Friend';
        });

        peerConn.on('data', (data) => {
            // Forward remote event directly to python client
            if (wsBridge && wsBridge.readyState === WebSocket.OPEN) {
                data.origin = "remote";
                wsBridge.send(JSON.stringify(data));
            }
        });

        peerConn.on('close', () => {
            document.getElementById('peerDot').className = 'dot';
            document.getElementById('peerStatus').innerText = 'Disconnected';
        });
    }

    function sendControl(action) {
        if (wsBridge && wsBridge.readyState === WebSocket.OPEN) {
            wsBridge.send(JSON.stringify({ origin: "user_ui", action: action }));
        }
    }
</script>
</body>
</html>
